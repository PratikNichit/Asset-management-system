# pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-file-index"
version = "0.1.0"
description = "Local token‑efficient AI file discovery for React/TS/MUI/Redux projects"
readme = "README.md"
authors = [{name = "User", email = ""}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click",
    "toml",
    "tqdm"
]

[project.scripts]
ai-index = "ai_file_index.cli.main:cli"
